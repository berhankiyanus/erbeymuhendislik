<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa Bulunamadı — Erbey Mühendislik</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080A">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#08080A; color:#EDEBE6; font-family:'Inter',sans-serif;
    background-image:
      linear-gradient(rgba(201,162,39,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,39,.04) 1px, transparent 1px);
    background-size:56px 56px;
  }
  .box { text-align:center; padding:2rem; max-width:560px; }
  .code {
    font-family:'Outfit',sans-serif; font-weight:200;
    font-size:clamp(6rem,20vw,11rem); line-height:1; letter-spacing:-.03em;
    background:linear-gradient(120deg,#8a6d1c,#C9A227 45%,#f0d478 55%,#C9A227);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .plate {
    display:inline-block; margin:1rem 0 1.6rem; padding:.4rem .9rem;
    border:1px solid rgba(201,162,39,.35); color:#C9A227;
    font-size:.68rem; letter-spacing:.22em; text-transform:uppercase;
  }
  h1 { font-family:'Outfit',sans-serif; font-weight:300; font-size:clamp(1.4rem,4vw,2rem); margin-bottom:.9rem; }
  p { color:#9a968e; font-weight:300; line-height:1.7; margin-bottom:2.2rem; }
  a.btn {
    display:inline-block; padding:1rem 2.2rem; text-decoration:none;
    color:#0A0A0A; font-size:.8rem; letter-spacing:.18em; text-transform:uppercase;
    background:linear-gradient(120deg,#8a6d1c,#C9A227 40%,#f0d478 60%,#C9A227);
  }
  a.alt { display:inline-block; margin-left:1.2rem; color:#EDEBE6; text-decoration:none;
    font-size:.8rem; letter-spacing:.18em; text-transform:uppercase;
    padding:1rem 0; border-bottom:1px solid rgba(201,162,39,.4); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="plate">Pafta bulunamadı</div>
    <h1>Aradığınız sayfa projede yok</h1>
    <p>Adres değişmiş ya da hatalı yazılmış olabilir. Sizi sağlam zemine geri alalım.</p>
    <a class="btn" href="/">Ana Sayfa</a>
    <a class="alt" href="/projeler.html">Projelerimiz</a>
  </div>
</body>
</html>
